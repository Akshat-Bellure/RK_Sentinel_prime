<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RK Sentinel Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Leaflet Map Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: {
                900: '#0B2545', // Primary Brand
                800: '#133E6E',
                700: '#1E40AF',
              },
              teal: {
                400: '#0FB7B3', // Accent
                500: '#0D9488',
              },
              gov: {
                surface: '#F8FAFC', // Light surface for contrast if needed
                warning: '#F6A623',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              header: ['Rajdhani', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>

    <style>
      :root {
        --gov-navy: #0B2545;
        --gov-teal: #0FB7B3;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a; /* Slate 900 */
        color: #f1f5f9;
      }
      h1, h2, h3, h4, h5, h6, .font-header {
        font-family: 'Rajdhani', sans-serif;
      }
      
      /* Professional Panel - clean lines, no neon glow */
      .glass-panel {
        background: #1e293b; /* Slate 800 Solid */
        border: 1px solid #334155;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      
      /* Scanner Animation - Subtle */
      .scanner-container {
        position: relative;
        overflow: hidden;
      }
      .scanner-line {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: #0FB7B3; 
        opacity: 0;
        z-index: 20;
        pointer-events: none;
      }
      .scanning .scanner-line {
        animation: scan 2.5s ease-in-out infinite;
      }
      @keyframes scan {
        0% { top: 0; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }

      .fade-in {
        animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }

      /* Leaflet Professional Overrides */
      .leaflet-popup-content-wrapper, .leaflet-popup-tip {
        background: #0B2545; 
        color: #f1f5f9;
        border: 1px solid #1e293b;
        border-radius: 4px;
      }
      .leaflet-popup-content {
        margin: 12px;
        font-family: 'Inter', sans-serif;
        font-size: 13px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@playwright/test": "https://esm.sh/@playwright/test@^1.58.2"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
