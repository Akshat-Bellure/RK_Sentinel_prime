replicaCount: 2

image:
  backend:
    repository: sentinel-prime
    pullPolicy: IfNotPresent
    tag: "latest"
  ai:
    repository: sentinel-prime-ai
    pullPolicy: IfNotPresent
    tag: "latest"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  backend:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  ai:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi

env:
  region: "ap-south-1"
